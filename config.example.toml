# Copy to config.toml and fill in your key: just init (or cp config.example.toml config.toml)
# config.toml is in .gitignore and won't be committed

# Which model picks the pet's actions: "ollama" (local, [ollama] below) or "gemini" ([gemini] below)
brain = "ollama"

[ollama]
host = "http://localhost:11434"
model = "hf.co/AtomicChat/Inkling-2-Mini-Uncensored-GGUF:IQ3_S"
# Max seconds to wait per request (the first request also loads the model into memory)
timeout = 30

[gemini]
# Leave empty to read the GEMINI_API_KEY / GOOGLE_API_KEY environment variable instead
api_key = ""
model = "gemini-3.5-flash-lite"
# If the main model is busy (429/5xx) or times out, try these models in order
fallback_models = ["gemini-3.8-flash"]
# Thinking level: low / medium / high
thinking_level = "low"
# Max seconds to wait per request
timeout = 20

[memory]
# The LLM sees how long ago each remembered action happened ("-12s").
# That time = real seconds since the action * time_scale.
# e.g. 60 makes one real second count as one minute for the pet.
time_scale = 1.0

# How older memories are forgotten (--forgetting on the command line overrides this):
#   none        remember everything as it was (the default)
#   chars       older entries lose a growing share of their characters
#   ebbinghaus  retention decays with time: clear -> vague -> dropped
#   llm         a model rewrites the memory as the pet remembers it (one extra API call per decision)
forgetting = "none"

# chars: entries in the first fade_start share of the memory (the most recent ones) stay intact;
# after that the deleted share grows linearly, reaching fade_max at the oldest entry.
fade_start = 0.5
fade_max = 0.8

# ebbinghaus: retention = exp(-age / (strength * 10)), strength = importance * (1 + ln 2),
# where age is in the pet's time (real seconds * time_scale).
# Below retention_threshold an entry turns vague; below drop_threshold it is dropped.
# With the defaults: vague after about 10s, dropped after about 20s.
importance = 0.5
retention_threshold = 0.3
drop_threshold = 0.1

# llm: the model asked to rewrite the memory
forget_model = "gemma-4-26b-a4b-it"
