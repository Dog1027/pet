# Copy to config.toml and fill in your key: just init (or cp config.example.toml config.toml)
# config.toml is in .gitignore and won't be committed

[gemini]
# Leave empty to read the GEMINI_API_KEY / GOOGLE_API_KEY environment variable instead
api_key = ""
model = "gemini-3.5-flash-lite"
# If the main model is busy (429/5xx) or times out, try these models in order
fallback_models = ["gemini-3.8-flash"]
# Thinking level: low / medium / high
thinking_level = "low"
# Max seconds to wait per request
timeout = 20

[memory]
# The LLM sees how long ago each remembered action happened ("-12s").
# That time = real seconds since the action * time_scale.
# e.g. 60 makes one real second count as one minute for the pet.
time_scale = 1.0

# Older memories fade: some characters are replaced by commas.
# Entries in the first fade_start share of the memory (the most recent ones) stay intact;
# after that the blanked share grows linearly, reaching fade_max at the oldest entry.
fade_start = 0.5
fade_max = 0.8
