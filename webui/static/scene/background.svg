<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <!-- The pet's meadow, behind everything. The light strip of grass across the whole width is
       the floor: the page's invisible 16 x 16 grid covers x 160-1040, y 480-797 of it
       (narrower than the strip so the pet stays on screen at the edges; clicks on the strip
       outside it go to the nearest cell)
       (see #grid in style.css); keep the two in step if either moves. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeedd"/>
      <stop offset=".55" stop-color="#f3f3e4"/>
      <stop offset="1" stop-color="#e6f2e6"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff9e6"/>
      <stop offset=".55" stop-color="#fff3d1"/>
      <stop offset="1" stop-color="#fff3d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8c8"/>
      <stop offset="1" stop-color="#bfdfb8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f1d6"/>
      <stop offset=".5" stop-color="#eaf5dd"/>
      <stop offset="1" stop-color="#dcefcf"/>
    </linearGradient>
    <g id="cloud">
      <path d="M-70 18 Q-82 -8 -52 -14 Q-46 -42 -14 -36 Q4 -60 32 -40 Q66 -46 66 -14 Q92 -8 80 18 Z"
            fill="#fffdf8" stroke="#eadfcd" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g id="tree">
      <rect x="-6" y="-8" width="12" height="40" rx="5" fill="#d9b48f" stroke="#a98466" stroke-width="2.5"/>
      <circle cx="0" cy="-30" r="34" fill="#b9e0c0" stroke="#8fbf9a" stroke-width="3"/>
      <circle cx="-12" cy="-40" r="10" fill="#d3eed6"/>
    </g>
    <g id="flower">
      <g fill="#ffe1e7" stroke="#e9a9b6" stroke-width="1.5">
        <circle cx="0" cy="-6" r="5"/><circle cx="6" cy="0" r="5"/><circle cx="0" cy="6" r="5"/><circle cx="-6" cy="0" r="5"/>
      </g>
      <circle r="3.6" fill="#ffd77a" stroke="#d9a94a" stroke-width="1.2"/>
    </g>
    <g id="daisy">
      <g fill="#fffdf6" stroke="#d8cbb4" stroke-width="1.3">
        <ellipse cx="0" cy="-6" rx="3" ry="5"/><ellipse cx="6" cy="0" rx="5" ry="3"/>
        <ellipse cx="0" cy="6" rx="3" ry="5"/><ellipse cx="-6" cy="0" rx="5" ry="3"/>
      </g>
      <circle r="3" fill="#ffcf66"/>
    </g>
    <path id="blade" d="M-6 0 Q-4 -7 -1 -11 M0 0 Q1 -9 3 -14 M5 0 Q6 -6 9 -9"
          fill="none" stroke="#a7d09e" stroke-width="2.4" stroke-linecap="round"/>
  </defs>

  <!-- sky -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="985" cy="120" r="110" fill="url(#sun)"/>
  <circle cx="985" cy="120" r="46" fill="#fff4cf" stroke="#f3dca3" stroke-width="3"/>
  <use href="#cloud" transform="translate(220 120) scale(1.1)"/>
  <use href="#cloud" transform="translate(610 85) scale(.75)"/>
  <use href="#cloud" transform="translate(820 215) scale(.6)"/>

  <!-- far and near hills -->
  <path d="M0 360 Q160 290 330 330 Q470 362 600 318 Q760 262 930 318 Q1080 366 1200 322 V900 H0 Z"
        fill="#d9ecd3" stroke="#b8d6b1" stroke-width="3"/>
  <use href="#tree" transform="translate(150 318) scale(.8)"/>
  <use href="#tree" transform="translate(1065 322) scale(.95)"/>
  <use href="#tree" transform="translate(705 300) scale(.6)"/>
  <path d="M0 420 Q220 370 460 396 Q700 420 900 382 Q1060 352 1200 392 V900 H0 Z"
        fill="url(#ground)" stroke="#a9d2a0" stroke-width="3"/>

  <!-- grass marks and flowers on the slope behind the floor -->
  <g>
    <use href="#blade" transform="translate(90 450)"/><use href="#blade" transform="translate(420 418)"/>
    <use href="#blade" transform="translate(860 410)"/><use href="#blade" transform="translate(1120 430)"/>
  </g>
  <use href="#flower" transform="translate(250 440) scale(.8)"/>
  <use href="#daisy" transform="translate(600 425) scale(.75)"/>
  <use href="#flower" transform="translate(965 420) scale(.7)"/>
  <use href="#daisy" transform="translate(1060 446) scale(.8)"/>

  <!-- the floor: a strip of short, lighter grass across the whole width (the grid: y 480-797) -->
  <path d="M-10 470 Q150 452 320 462 Q520 474 700 458 Q900 444 1060 460 Q1140 466 1210 456 V910 H-10 Z"
        fill="url(#floor)" stroke="#b3d8a8" stroke-width="4"/>
  <g stroke="#cfe6c2" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M170 540 q3 -8 6 -11 M178 540 q2 -9 4 -13"/>
    <path d="M430 510 q3 -8 6 -11 M438 510 q2 -9 4 -13"/>
    <path d="M760 530 q3 -8 6 -11 M768 530 q2 -9 4 -13"/>
    <path d="M1010 560 q3 -8 6 -11 M1018 560 q2 -9 4 -13"/>
    <path d="M300 650 q3 -8 6 -11 M308 650 q2 -9 4 -13"/>
    <path d="M610 690 q3 -8 6 -11 M618 690 q2 -9 4 -13"/>
    <path d="M900 660 q3 -8 6 -11 M908 660 q2 -9 4 -13"/>
    <path d="M140 760 q3 -8 6 -11 M148 760 q2 -9 4 -13"/>
    <path d="M480 790 q3 -8 6 -11 M488 790 q2 -9 4 -13"/>
    <path d="M1080 780 q3 -8 6 -11 M1088 780 q2 -9 4 -13"/>
  </g>
</svg>