<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <!-- The pet's meadow, behind everything. The light strip of grass across the whole width is
       the floor: the page's invisible 16 x 16 grid covers x 160-1040, y 480-797 of it
       (narrower than the strip so the pet stays on screen at the edges; clicks on the strip
       outside it go to the nearest cell)
       (see #grid in style.css); keep the two in step if either moves.
       Drawn like the pet: soft pastel fills inside one dark brown line (#583329, the pet's
       outline), with rounded joins; things further back get a slightly thinner line. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeedd"/>
      <stop offset=".55" stop-color="#f6f3e4"/>
      <stop offset="1" stop-color="#eef4e4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcefd5"/>
      <stop offset="1" stop-color="#d0e8c8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8e6bd"/>
      <stop offset="1" stop-color="#bcdfb0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2f1d4"/>
      <stop offset=".5" stop-color="#eaf5dd"/>
      <stop offset="1" stop-color="#dcefcf"/>
    </linearGradient>
    <g id="cloud" stroke="#583329" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-70 18 Q-82 -8 -52 -14 Q-46 -42 -14 -36 Q4 -60 32 -40 Q66 -46 66 -14 Q92 -8 80 18 Z"
            fill="#fffdf8" stroke-width="3"/>
      <path d="M-40 -16 Q-30 -30 -14 -26" fill="none" stroke="#f1e6d6" stroke-width="5"/>
    </g>
    <g id="tree" stroke="#583329" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-6 30 L-5 -6 Q0 -10 5 -6 L6 30 Q0 33 -6 30 Z" fill="#e2bf99"/>
      <path d="M0 -64 Q-30 -64 -34 -36 Q-40 -8 -14 -2 Q0 4 14 -2 Q40 -8 34 -36 Q30 -64 0 -64 Z" fill="#b9e0bb"/>
      <path d="M-20 -40 Q-16 -52 -4 -54" fill="none" stroke="#dcf1d9" stroke-width="6"/>
    </g>
    <g id="flower" stroke="#583329" stroke-width="1.8" stroke-linejoin="round">
      <g fill="#ffd9e1">
        <circle cx="0" cy="-6" r="5"/><circle cx="6" cy="0" r="5"/><circle cx="0" cy="6" r="5"/><circle cx="-6" cy="0" r="5"/>
      </g>
      <circle r="3.4" fill="#ffd77a"/>
    </g>
    <g id="daisy" stroke="#583329" stroke-width="1.6" stroke-linejoin="round">
      <g fill="#fffdf6">
        <ellipse cx="0" cy="-6" rx="3" ry="5"/><ellipse cx="6" cy="0" rx="5" ry="3"/>
        <ellipse cx="0" cy="6" rx="3" ry="5"/><ellipse cx="-6" cy="0" rx="5" ry="3"/>
      </g>
      <circle r="3" fill="#ffcf66"/>
    </g>
    <path id="blade" d="M-6 0 Q-4 -7 -1 -11 M0 0 Q1 -9 3 -14 M5 0 Q6 -6 9 -9"
          fill="none" stroke="#583329" stroke-width="2.2" stroke-linecap="round"/>
    <!-- a tuft of short grass on the floor: two little strokes -->
    <path id="mark" d="M0 0 q3 -8 6 -11 M8 0 q2 -9 4 -13"
          fill="none" stroke="#583329" stroke-width="2" stroke-linecap="round" opacity=".45"/>
  </defs>

  <!-- sky -->
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="985" cy="120" r="105" fill="url(#glow)"/>
  <circle cx="985" cy="120" r="44" fill="#ffefb8" stroke="#583329" stroke-width="3"/>
  <path d="M960 100 Q968 86 984 84" fill="none" stroke="#fff8dc" stroke-width="6" stroke-linecap="round"/>
  <use href="#cloud" transform="translate(220 120) scale(1.1)"/>
  <use href="#cloud" transform="translate(610 85) scale(.75)"/>
  <use href="#cloud" transform="translate(820 215) scale(.6)"/>

  <!-- far hills with trees, then the near slope -->
  <path d="M-10 360 Q160 290 330 330 Q470 362 600 318 Q760 262 930 318 Q1080 366 1210 322 V910 H-10 Z"
        fill="url(#far)" stroke="#583329" stroke-width="2.6" stroke-linejoin="round"/>
  <use href="#tree" transform="translate(150 322) scale(.8)"/>
  <use href="#tree" transform="translate(1065 326) scale(.95)"/>
  <use href="#tree" transform="translate(705 304) scale(.6)"/>
  <path d="M-10 420 Q220 370 460 396 Q700 420 900 382 Q1060 352 1210 392 V910 H-10 Z"
        fill="url(#ground)" stroke="#583329" stroke-width="3" stroke-linejoin="round"/>

  <!-- grass marks and flowers on the slope behind the floor -->
  <g opacity=".55">
    <use href="#blade" transform="translate(90 450)"/><use href="#blade" transform="translate(420 418)"/>
    <use href="#blade" transform="translate(860 410)"/><use href="#blade" transform="translate(1120 430)"/>
  </g>
  <use href="#flower" transform="translate(250 440) scale(.8)"/>
  <use href="#daisy" transform="translate(600 425) scale(.75)"/>
  <use href="#flower" transform="translate(965 420) scale(.7)"/>
  <use href="#daisy" transform="translate(1060 446) scale(.8)"/>

  <!-- the floor: a strip of short, lighter grass across the whole width (the grid: y 480-797) -->
  <path d="M-10 470 Q150 452 320 462 Q520 474 700 458 Q900 444 1060 460 Q1140 466 1210 456 V910 H-10 Z"
        fill="url(#floor)" stroke="#583329" stroke-width="3.2" stroke-linejoin="round"/>
  <g>
    <use href="#mark" x="170" y="540"/><use href="#mark" x="430" y="510"/>
    <use href="#mark" x="760" y="530"/><use href="#mark" x="1010" y="560"/>
    <use href="#mark" x="300" y="650"/><use href="#mark" x="610" y="690"/>
    <use href="#mark" x="900" y="660"/><use href="#mark" x="140" y="760"/>
    <use href="#mark" x="480" y="790"/><use href="#mark" x="1080" y="780"/>
  </g>
</svg>
